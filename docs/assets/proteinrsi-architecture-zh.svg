  <title id="fig-title">实验反馈驱动的自改进蛋白智能体</title>
  <desc id="fig-description">中文可编辑项目架构图。上层为蛋白研究任务、蛋白智能体团队、设计与预测、真实实验反馈的任务内闭环。下层从反馈进入自改进与RSI探索，再将验证结果沉淀为带适用范围的方法经验，供新蛋白和新任务复用。新机制经验证后用于下一轮改进。箭头均沿模块外的独立通道连接，不穿过文字或非目标模块。以用户既有项目概念为基础，主要修订语言、层级及布局，未增加实验结果或已验证能力声明。</desc>
