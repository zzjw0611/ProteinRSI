[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "proteinrsi"
version = "0.5.0"
description = "Budgeted, experimental-feedback-driven protein research agents with validated workflow and meta-policy evolution"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT AND Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY.md", "licenses/*.txt"]
authors = [{name = "ProteinRSI contributors"}]
dependencies = ["pydantic>=2.10,<3", "numpy>=1.26,<3", "httpx>=0.27,<1", "jsonschema>=4.20,<5"]

[project.optional-dependencies]
esmc-client = ["huggingface-hub>=1,<2"]
esmc = ["torch>=2.6,<3", "transformers==5.16.1", "huggingface-hub>=1,<2", "safetensors>=0.4"]
graph = ["langgraph>=0.3,<2", "langgraph-checkpoint-sqlite>=2,<4"]
gepa = ["gepa>=0.0.17,<1"]
mcp = ["mcp>=1.12,<2"]
virtual-lab = ["virtual-lab>=0.0.1"]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.11,<1", "build>=1,<2"]

[project.scripts]
proteinrsi = "proteinrsi.cli:main"

[project.urls]
Repository = "https://github.com/zzjw0611/ProteinRSI"
Issues = "https://github.com/zzjw0611/ProteinRSI/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
proteinrsi = ["skills/*/SKILL.md", "skills/*/*.json", "localtools/descriptions/*.json", "research/know_how/*.md", "prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["real_esmc: explicitly downloads and runs official ESMC-600M weights"]

[tool.ruff]
# Frozen experiment programs use sandbox-injected globals; they are audit data.
extend-exclude = ["experiments"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
