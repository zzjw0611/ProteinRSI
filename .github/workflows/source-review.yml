name: source-review
on:
  push:
    branches: ['review/method-governance']
permissions:
  contents: read
jobs:
  test-reviewed-source:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    env:
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python .github/review-payloads/apply.py
      - run: pip install -e '.[dev,graph,gepa,mcp]' 'biopython>=1.84,<2'
      - run: git diff --check && ruff check .
      - run: pytest -q --cov=proteinrsi --cov-report=term-missing | tee /tmp/test-results.txt
      - run: proteinrsi demo --out runs/ci-demo --rounds 3
      - run: proteinrsi demo --adaptive --out runs/ci-research-demo --rounds 3
      - run: proteinrsi research plans --campaign runs/ci-research-demo/campaign
      - run: proteinrsi sandbox-check
      - run: proteinrsi methods status --campaign runs/ci-demo/campaign
      - run: python -m build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reviewed-results-${{ matrix.python-version }}
          path: /tmp/test-results.txt
          retention-days: 3
  materialize-reviewed-source:
    needs: test-reviewed-source
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: python .github/review-payloads/apply.py
      - name: Commit tested source only on review branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests docs configs README.md CHANGELOG.md
          git diff --cached --check
          git commit -m 'feat: govern method candidates with immutable snapshots and audited rollback'
          git push origin HEAD:refs/heads/review/method-governance
