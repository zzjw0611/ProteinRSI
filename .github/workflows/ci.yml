name: tests
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      real_esmc:
        description: 'Download official ESMC-600M and run a CPU smoke test'
        required: false
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    env:
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev,graph,gepa,mcp]'
      - run: ruff check .
      - run: pytest -q --cov=proteinrsi --cov-report=term-missing
      - run: proteinrsi demo --out runs/ci-demo --rounds 3
      - run: python -m build

  esmc-native:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install 'torch>=2.6,<3' --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e '.[esmc,dev]'
      - run: pytest -q tests/test_esmc.py -m 'not real_esmc'

  esmc-pretrained:
    if: (github.event_name == 'workflow_dispatch' && inputs.real_esmc) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[test-esmc600m]'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
      HF_HUB_DISABLE_TELEMETRY: '1'
      PROTEINRSI_RUN_ESMC600M: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install 'torch>=2.6,<3' --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e '.[esmc,dev]'
      - run: pytest -s -q tests/test_esmc.py -m real_esmc
